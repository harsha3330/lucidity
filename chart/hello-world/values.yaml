image:
  repository: ""
  tag: ""

replicaCount: 2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
